<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PRO FPS - Real Models</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Modellarni yuklash uchun qo'shimcha kutubxona -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;overflow:hidden;font-family:Arial,sans-serif;touch-action:none;user-select:none}
#game{display:block;width:100vw;height:100dvh}
#hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none;color:#fff;font-weight:bold;text-shadow:0 2px 4px #000}
.stat{background:rgba(0,0,0,0.6);padding:8px 14px;border-radius:8px;font-size:14px;border:1px solid rgba(255,255,255,0.2)}
#crosshair{position:absolute;top:50%;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;pointer-events:none;z-index:10}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#00ff00;box-shadow:0 0 5px #00ff00}
#crosshair::before{width:2px;height:20px;left:9px}
#crosshair::after{width:20px;height:2px;top:9px}
#joy{position:absolute;bottom:40px;left:30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.3)}
#stick{position:absolute;width:45px;height:45px;left:32.5px;top:32.5px;background:rgba(255,255,255,0.7);border-radius:50%}
#fire{position:absolute;bottom:50px;right:30px;width:80px;height:80px;border-radius:50%;background:rgba(255,50,50,0.8);color:#fff;border:2px solid #fff;font-size:15px;font-weight:bold}
#look{position:absolute;top:0;right:0;width:60%;height:85%;touch-action:none}
#loading{position:absolute;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;font-size:20px}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;z-index:20}
.box{background:#1a1a1a;padding:30px;border-radius:12px;max-width:360px;width:90%;border:1px solid #333}
.box h1{color:#00ffcc;margin-bottom:10px;font-size:24px}
.box p{font-size:14px;color:#aaa;line-height:1.6;margin-bottom:20px}
.box button{width:100%;padding:15px;border:0;border-radius:8px;background:#00ffcc;color:#000;font-size:18px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="loading">Yuklanmoqda... (Internet kerak)</div>
<div id="hud">
  <div class="stat">🎯 <span id="score">0</span></div>
  <div class="stat">❤️ <span id="hp">100</span></div>
</div>
<div id="crosshair"></div>
<div id="joy"><div id="stick"></div></div>
<div id="look"></div>
<button id="fire">FIRE</button>
<div id="overlay" style="display:none"><div class="box">
  <h1>PRO FPS ARENA</h1>
  <p>Chap joystick — yurish.<br>O'ng barmoq — atrofga qarash.<br>FIRE — o'q otish.</p>
  <button id="play">JANGNI BOSHLASH</button>
</div></div>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); 
scene.fog = new THREE.FogExp2(0x87CEEB, 0.01);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('game'), antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// Yorug'lik
const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
sunLight.position.set(50, 100, 50);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.left = -50;
sunLight.shadow.camera.right = 50;
sunLight.shadow.camera.top = 50;
sunLight.shadow.camera.bottom = -50;
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

// Pol (O't)
const groundGeo = new THREE.PlaneGeometry(500, 500);
// Polga tekstura (rasm) yuklaymiz
const textureLoader = new THREE.TextureLoader();
const grassTexture = textureLoader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
grassTexture.wrapS = THREE.RepeatWrapping;
grassTexture.wrapT = THREE.RepeatWrapping;
grassTexture.repeat.set(50, 50); // Ko'p marta takrorlash
const groundMat = new THREE.MeshStandardMaterial({map: grassTexture, roughness: 1});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Modellarni yuklash funksiyasi
const loader = new THREE.GLTFLoader();
let playerGun = null;
let enemyModel = null;

// 1. O'yinchi quroli (M4 yoki AR-15 modeli)
loader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Shark.glb', function(gltf) {
  // Eslatma: Shark - bu akula, lekin Three.js rasmiy misollarida bor. 
  // Haqiqiy qurol modeli 50MB bo'lgani uchun bu yerda kichikroq model ishlatamiz, lekin sizga shuni aytaman: buni o'zingizning .glb qurolingizga almashtirsangiz bo'ladi.
  playerGun = gltf.scene;
  playerGun.scale.set(0.1, 0.1, 0.1); // Kichraytirish
  playerGun.position.set(0.3, -0.3, -0.6);
  playerGun.rotation.y = Math.PI / 2;
  camera.add(playerGun);
  scene.add(camera);
  
  document.getElementById('loading').style.display = 'none';
  document.getElementById('overlay').style.display = 'flex';
}, undefined, function(error) {
  console.error(error);
  document.getElementById('loading').innerText = "Xatolik: Internetni tekshiring.";
});

// 2. Dushman askari (Robot yoki Odam modeli)
loader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/RobotExpressive/RobotExpressive.glb', function(gltf) {
  enemyModel = gltf.scene;
  enemyModel.scale.set(0.5, 0.5, 0.5); // Odam bo'yiga moslash
}, undefined, function(error) {
  console.error(error);
});

// Daraxtlar (Haqiqiy model)
let treeModel = null;
loader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/PineTree.glb', function(gltf) {
  treeModel = gltf.scene;
  // Daraxtlarni o'rmon qilib ekish
  for(let i=0; i<40; i++) {
    const tree = treeModel.clone();
    tree.position.set(Math.random()*200-100, 0, Math.random()*200-100);
    tree.scale.set(2, 2, 2);
    tree.castShadow = true;
    tree.receiveShadow = true;
    scene.add(tree);
  }
});

let enemies = [];
let bullets = [];
let hp = 100, score = 0, running = false, firing = false, lastShotTime = 0;
let yaw = 0, pitch = 0, joy = {x:0, y:0};

function spawnEnemy() {
  if(!enemyModel || enemies.length >= 5) return;
  const e = enemyModel.clone();
  e.position.set(Math.random()*40-20, 0, Math.random()*-50-10); // Oldinda
  e.castShadow = true;
  scene.add(e);
  enemies.push({ mesh: e, lastShot: 0, hp: 100 });
}

function playerShoot() {
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const intersects = raycaster.intersectObjects(enemies.map(e => e.mesh), true);

  const bGeo = new THREE.SphereGeometry(0.05);
  const bMat = new THREE.MeshBasicMaterial({color: 0xffff00});
  const bullet = new THREE.Mesh(bGeo, bMat);
  
  const startPos = new THREE.Vector3();
  camera.getWorldPosition(startPos);
  bullet.position.copy(startPos);
  
  const targetPos = intersects.length > 0 ? intersects[0].point : raycaster.ray.at(100, new THREE.Vector3());
  const dir = targetPos.clone().sub(startPos).normalize();
  
  scene.add(bullet);
  bullets.push({ mesh: bullet, dir: dir, life: 0.5 });

  if (intersects.length > 0) {
    // Dushmanga tegdi
    let hitEnemy = enemies.find(e => e.mesh === intersects[0].object.parent || e.mesh === intersects[0].object);
    if(hitEnemy) {
      scene.remove(hitEnemy.mesh);
      enemies = enemies.filter(e => e !== hitEnemy);
      score++;
      document.getElementById('score').textContent = score;
    }
  }
}

// Boshqaruv (oldingi koddagi kabi)
const joyEl = document.getElementById('joy'), stick = document.getElementById('stick');
let joyActive = false;
joyEl.addEventListener('pointerdown', e => { joyActive = true; joyEl.setPointerCapture(e.pointerId); });
joyEl.addEventListener('pointermove', e => {
  if(!joyActive) return;
  const r = joyEl.getBoundingClientRect();
  let x = e.clientX - r.left - r.width/2;
  let y = e.clientY - r.top - r.height/2;
  const max = 30, d = Math.hypot(x,y);
  if(d > max){ x = x/d*max; y = y/d*max; }
  joy.x = x/max; joy.y = y/max;
  stick.style.transform = `translate(${x}px,${y}px)`;
});
joyEl.addEventListener('pointerup', () => { joyActive = false; joy={x:0,y:0}; stick.style.transform='translate(0,0)'; });

const lookEl = document.getElementById('look');
let lookActive = false, lastX = 0, lastY = 0;
lookEl.addEventListener('pointerdown', e => { lookActive = true; lastX = e.clientX; lastY = e.clientY; lookEl.setPointerCapture(e.pointerId); });
lookEl.addEventListener('pointermove', e => {
  if(!lookActive) return;
  yaw -= (e.clientX - lastX) * 0.003;
  pitch = THREE.MathUtils.clamp(pitch - (e.clientY - lastY) * 0.003, -1.0, 1.0);
  lastX = e.clientX; lastY = e.clientY;
});
lookEl.addEventListener('pointerup', () => lookActive = false);

const fireBtn = document.getElementById('fire');
fireBtn.addEventListener('pointerdown', e => { e.preventDefault(); firing = true; });
fireBtn.addEventListener('pointerup', () => firing = false);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  if(running) {
    camera.rotation.order = 'YXZ';
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    const speed = 8;
    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    forward.y = 0; forward.normalize();
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    right.y = 0; right.normalize();

    const moveDir = new THREE.Vector3();
    moveDir.addScaledVector(forward, -joy.y);
    moveDir.addScaledVector(right, joy.x);
    
    if(moveDir.length() > 0) {
      moveDir.normalize();
      camera.position.addScaledVector(moveDir, speed * dt);
    }
    camera.position.y = 1.6;

    if(firing && Date.now() - lastShotTime > 150) {
      playerShoot();
      lastShotTime = Date.now();
    }

    // O'qlar
    for(let i = bullets.length-1; i >= 0; i--) {
      bullets[i].mesh.position.addScaledVector(bullets[i].dir, 100 * dt);
      bullets[i].life -= dt;
      if(bullets[i].life <= 0) { scene.remove(bullets[i].mesh); bullets.splice(i, 1); }
    }
  }

  renderer.render(scene, camera);
}

document.getElementById('play').onclick = () => {
  document.getElementById('overlay').style.display = 'none';
  running = true;
  camera.position.set(0, 1.6, 0);
  for(let i=0; i<3; i++) spawnEnemy();
};

setInterval(() => { if(running && enemyModel) spawnEnemy(); }, 3000);
animate();
</script>
</body>
</html>
