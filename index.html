<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MEGA ARENA 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d17;color:white;font-family:Arial;overflow:hidden;touch-action:none}
#game{width:100vw;height:100dvh;display:block}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.stat{background:#101d30dd;padding:12px;border-radius:12px;font-weight:bold}
#joystick{position:absolute;bottom:35px;left:30px;width:125px;height:125px;border-radius:50%;background:#ffffff35;border:2px solid #ffffff70;touch-action:none}
#stick{position:absolute;width:55px;height:55px;left:33px;top:33px;background:#48baff;border-radius:50%;box-shadow:0 0 15px #48baff}
#fire{position:absolute;right:28px;bottom:48px;width:90px;height:90px;border-radius:50%;background:#ed344d;color:white;border:3px solid #ffffff80;font-size:18px;font-weight:bold}
#message{position:absolute;top:45%;width:100%;text-align:center;font-size:30px;font-weight:bold;pointer-events:none}
#start{position:absolute;inset:0;background:#07101eeF;display:flex;align-items:center;justify-content:center;text-align:center}
.box{background:#17243b;padding:28px;border-radius:20px;width:85%;max-width:350px}
button{cursor:pointer}
#play{background:#1684ff;color:white;border:0;border-radius:12px;padding:16px;width:100%;font-size:18px;font-weight:bold}
#hint{font-size:12px;color:#aabbd1;line-height:1.7}
</style>
</head>
<body>

<div id="hud">
<div class="stat">🔫 MEGA ARENA</div>
<div class="stat">🏆 <span id="score">0</span></div>
<div class="stat">❤️ <span id="health">100</span></div>
</div>

<canvas id="game"></canvas>

<div id="joystick"><div id="stick"></div></div>
<button id="fire">FIRE 🔥</button>

<div id="message"></div>

<div id="start">
<div class="box">
<h1>🔫 SHOOTING ARENA</h1>
<h3>3D BATTLE</h3>
<p id="hint">
Dushmanlarni yo‘q qil!<br>
Joystick orqali harakatlan.<br>
FIRE tugmasi orqali otishma boshlagin.
</p>
<button id="play">JANGNI BOSHLASH</button>
</div>
</div>

<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8eb1ce);
scene.fog=new THREE.Fog(0x8eb1ce,35,100);

const camera=new THREE.PerspectiveCamera(
65,innerWidth/innerHeight,0.1,200
);

const renderer=new THREE.WebGLRenderer({
canvas:document.getElementById("game"),
antialias:true
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;

scene.add(new THREE.HemisphereLight(0xffffff,0x526477,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(10,20,10);
sun.castShadow=true;
scene.add(sun);

const floor=new THREE.Mesh(
new THREE.PlaneGeometry(100,100),
new THREE.MeshStandardMaterial({color:0x526b53})
);
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

const grid=new THREE.GridHelper(100,50,0x506b50,0x667966);
grid.position.y=0.02;
scene.add(grid);

// Arena devorlari
function wall(x,z,w,d){
const m=new THREE.Mesh(
new THREE.BoxGeometry(w,3,d),
new THREE.MeshStandardMaterial({color:0x566575})
);
m.position.set(x,1.5,z);
m.castShadow=true;
scene.add(m);
}
wall(0,-25,50,1);
wall(0,25,50,1);
wall(-25,0,1,50);
wall(25,0,1,50);

// To'siqlar
for(let i=0;i<12;i++){
const box=new THREE.Mesh(
new THREE.BoxGeometry(2,2,2),
new THREE.MeshStandardMaterial({color:0x7d705c})
);
box.position.set(
Math.random()*35-17,
1,
Math.random()*35-17
);
scene.add(box);
}

// Personaj yaratish
function createSoldier(color){
const g=new THREE.Group();

const mat=new THREE.MeshStandardMaterial({color});
const skin=new THREE.MeshStandardMaterial({color:0xd5a77d});

const body=new THREE.Mesh(
new THREE.BoxGeometry(.75,1,.4),mat
);
body.position.y=1.35;
g.add(body);

const head=new THREE.Mesh(
new THREE.SphereGeometry(.3,16,12),skin
);
head.position.y=2.1;
g.add(head);

const helmet=new THREE.Mesh(
new THREE.SphereGeometry(.34,16,10,0,Math.PI*2,0,Math.PI/2),
new THREE.MeshStandardMaterial({color:0x334b35})
);
helmet.position.y=2.22;
g.add(helmet);

const gun=new THREE.Mesh(
new THREE.BoxGeometry(.18,.18,.9),
new THREE.MeshStandardMaterial({color:0x222222})
);
gun.position.set(.48,1.5,-.5);
g.add(gun);

return g;
}

const player=createSoldier(0x237bd5);
scene.add(player);
player.position.set(0,0,5);

let enemies=[];
let bullets=[];
let score=0;
let hp=100;
let running=false;
let firing=false;
let joy={x:0,y:0};
let yaw=0;
let pitch=0;
let lastShot=0;

function spawnEnemy(){
if(enemies.length>=8)return;

const e=createSoldier(0xc92d43);
const a=Math.random()*Math.PI*2;
const d=12+Math.random()*8;

e.position.set(
Math.sin(a)*d,0,
Math.cos(a)*d
);
scene.add(e);
enemies.push(e);
}

function shoot(){
if(!enemies.length)return;

const target=enemies.reduce((a,b)=>
player.position.distanceTo(a.position)<
player.position.distanceTo(b.position)?a:b
);

const direction=new THREE.Vector3(
target.position.x-player.position.x,
1.4,
target.position.z-player.position.z
).normalize();

const bullet=new THREE.Mesh(
new THREE.SphereGeometry(.12,8,8),
new THREE.MeshBasicMaterial({color:0xffe45b})
);

bullet.position.copy(player.position);
bullet.position.y=1.5;
scene.add(bullet);

bullets.push({
mesh:bullet,
velocity:direction.multiplyScalar(.65),
target
});
}

function update(){
if(!running)return;

const forward=new THREE.Vector3(
-Math.sin(yaw),0,-Math.cos(yaw)
);
const right=new THREE.Vector3(
Math.cos(yaw),0,-Math.sin(yaw)
);

player.position.addScaledVector(forward,-joy.y*.13);
player.position.addScaledVector(right,joy.x*.13);

player.position.x=THREE.MathUtils.clamp(player.position.x,-23,23);
player.position.z=THREE.MathUtils.clamp(player.position.z,-23,23);

if(Math.abs(joy.x)+Math.abs(joy.y)>.1){
player.rotation.y=Math.atan2(-forward.x,-forward.z);
}

const cameraOffset=new THREE.Vector3(
Math.sin(yaw)*5,
3.3,
Math.cos(yaw)*5
);

camera.position.copy(player.position).add(cameraOffset);
camera.lookAt(
player.position.x,
player.position.y+1.4,
player.position.z
);

// Dushman harakati
enemies.forEach(e=>{
const dir=new THREE.Vector3(
player.position.x-e.position.x,
0,
player.position.z-e.position.z
);

const dist=dir.length();

if(dist>1.5){
dir.normalize();
e.position.addScaledVector(dir,.025);
e.rotation.y=Math.atan2(-dir.x,-dir.z);
}else{
hp-=.04;
document.getElementById("health").textContent=Math.max(0,Math.floor(hp));
}
});

// O'qlar
bullets.forEach((b,i)=>{
b.mesh.position.add(b.velocity);

if(b.mesh.position.distanceTo(b.target.position)<1){
scene.remove(b.mesh);
scene.remove(b.target);

enemies=enemies.filter(e=>e!==b.target);
bullets.splice(i,1);

score++;
document.getElementById("score").textContent=score;
}
});

if(hp<=0){
running=false;
document.getElementById("start").style.display="flex";
document.querySelector("#start h1").textContent="💀 JANG TUGADI";
document.getElementById("play").textContent="QAYTA O'YNASH";
}

renderer.render(scene,camera);
requestAnimationFrame(update);
}

// Joystick
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let active=false;

joystick.addEventListener("pointerdown",e=>{
active=true;
joystick.setPointerCapture(e.pointerId);
moveJoy(e);
});

joystick.addEventListener("pointermove",e=>{
if(active)moveJoy(e);
});

function moveJoy(e){
const r=joystick.getBoundingClientRect();
let x=e.clientX-r.left-r.width/2;
let y=e.clientY-r.top-r.height/2;
const max=38;
const d=Math.hypot(x,y);
if(d>max){x=x/d*max;y=y/d*max}
joy.x=x/max;
joy.y=y/max;
stick.style.transform=`translate(${x}px,${y}px)`;
}

function stopJoy(){
active=false;
joy={x:0,y:0};
stick.style.transform="translate(0,0)";
}

joystick.addEventListener("pointerup",stopJoy);
joystick.addEventListener("pointercancel",stopJoy);

// Otish
const fire=document.getElementById("fire");
fire.onpointerdown=e=>{e.preventDefault();firing=true};
fire.onpointerup=()=>firing=false;
fire.onpointerleave=()=>firing=false;

function fireLoop(){
if(running&&firing&&Date.now()-lastShot>450){
shoot();
lastShot=Date.now();
}
requestAnimationFrame(fireLoop);
}

document.getElementById("play").onclick=()=>{
enemies.forEach(e=>scene.remove(e));
bullets.forEach(b=>scene.remove(b.mesh));
enemies=[];
bullets=[];
score=0;
hp=100;
yaw=0;
player.position.set(0,0,5);

document.getElementById("score").textContent=0;
document.getElementById("health").textContent=100;
document.getElementById("start").style.display="none";

running=true;

for(let i=0;i<5;i++)spawnEnemy();

update();
};

setInterval(()=>{
if(running)spawnEnemy();
},3500);

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

fireLoop();
</script>
</body>
</html>
