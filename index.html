<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ARENA FPS PRO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;overflow:hidden;font-family:Arial,sans-serif;touch-action:none;user-select:none}
#game{display:block;width:100vw;height:100dvh}
#hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none;color:#fff;font-weight:bold;text-shadow:0 2px 4px #000}
.stat{background:rgba(0,0,0,0.5);padding:8px 14px;border-radius:8px;font-size:14px;display:flex;align-items:center;gap:5px}
#crosshair{position:absolute;top:50%;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;pointer-events:none;z-index:10}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#fff;box-shadow:0 0 5px #fff}
#crosshair::before{width:2px;height:20px;left:9px}
#crosshair::after{width:20px;height:2px;top:9px}
#joy{position:absolute;bottom:40px;left:30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.3)}
#stick{position:absolute;width:45px;height:45px;left:32.5px;top:32.5px;background:rgba(255,255,255,0.7);border-radius:50%;box-shadow:0 0 10px rgba(0,0,0,0.5)}
#fire{position:absolute;bottom:50px;right:30px;width:80px;height:80px;border-radius:50%;background:rgba(255,50,50,0.8);color:#fff;border:2px solid #fff;font-size:15px;font-weight:bold;backdrop-filter:blur(4px)}
#look{position:absolute;top:0;right:0;width:60%;height:85%;touch-action:none}
#msg{position:absolute;top:40%;width:100%;text-align:center;color:#ff4444;font-size:28px;font-weight:bold;text-shadow:0 0 10px #000;pointer-events:none}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;z-index:20}
.box{background:#1a1a1a;padding:30px;border-radius:12px;max-width:360px;width:90%;border:1px solid #333}
.box h1{color:#00ffcc;margin-bottom:10px;font-size:24px}
.box p{font-size:14px;color:#aaa;line-height:1.6;margin-bottom:20px}
.box button{width:100%;padding:15px;border:0;border-radius:8px;background:#00ffcc;color:#000;font-size:18px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="stat">🎯 <span id="score">0</span></div>
  <div class="stat">❤️ <span id="hp">100</span></div>
</div>
<div id="crosshair"></div>
<div id="joy"><div id="stick"></div></div>
<div id="look"></div>
<button id="fire">FIRE</button>
<div id="msg"></div>
<div id="overlay"><div class="box">
  <h1>FPS ARENA PRO</h1>
  <p>Chap joystick — harakatlanish.<br>O'ng barmoq bilan ekranni suring — atrofga qarash.<br>FIRE — o'q otish.<br>Dushmanlarni yo'q qiling!</p>
  <button id="play">JANGNI BOSHLASH</button>
</div></div>

<script>
// Sahna va Kamera
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111820); 
scene.fog = new THREE.Fog(0x111820, 10, 80);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('game'), antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// Yorug'lik
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const moonLight = new THREE.DirectionalLight(0x88aaff, 1.2);
moonLight.position.set(20, 40, 20);
moonLight.castShadow = true;
moonLight.shadow.mapSize.width = 2048;
moonLight.shadow.mapSize.height = 2048;
moonLight.shadow.camera.left = -40;
moonLight.shadow.camera.right = 40;
moonLight.shadow.camera.top = 40;
moonLight.shadow.camera.bottom = -40;
scene.add(moonLight);

// Pol
const floorGeo = new THREE.PlaneGeometry(120, 120);
const floorMat = new THREE.MeshStandardMaterial({color: 0x22252a, roughness: 0.8});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// To'siqlar (Beton bloklar va daraxtlar)
const obstacles = [];
for(let i=0; i<30; i++){
  const w = 2 + Math.random()*4;
  const h = 1.5 + Math.random()*4;
  const d = 2 + Math.random()*4;
  
  // Ba'zi to'siqlar daraxt ko'rinishida
  if (i % 4 === 0) {
    const treeGroup = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 4, 6), new THREE.MeshStandardMaterial({color: 0x4a3b2a}));
    trunk.position.y = 2; trunk.castShadow = true;
    const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.5, 4, 7), new THREE.MeshStandardMaterial({color: 0x2d5a27}));
    leaves.position.y = 4.5; leaves.castShadow = true;
    treeGroup.add(trunk, leaves);
    treeGroup.position.set(Math.random()*80-40, 0, Math.random()*80-40);
    if(Math.abs(treeGroup.position.x) < 5 && Math.abs(treeGroup.position.z) < 5) continue;
    scene.add(treeGroup);
    obstacles.push(treeGroup);
  } else {
    // Beton blok
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({color: 0x444b54, roughness: 0.9})
    );
    box.position.set(Math.random()*80-40, h/2, Math.random()*80-40);
    if(Math.abs(box.position.x) < 5 && Math.abs(box.position.z) < 5) continue;
    box.castShadow = true;
    box.receiveShadow = true;
    scene.add(box);
    obstacles.push(box);
  }
}

// --- O'YINCHI QUROLI (Birinchi shaxs) ---
const gunGroup = new THREE.Group();
const gunMat = new THREE.MeshStandardMaterial({color: 0x111111, metalness: 0.8, roughness: 0.4});
const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.6), gunMat);
gunBody.position.set(0, 0, -0.3);
const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4), gunMat);
gunBarrel.rotation.x = Math.PI/2;
gunBarrel.position.set(0, 0.05, -0.7);
const gunHandle = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.1), gunMat);
gunHandle.position.set(0, -0.15, -0.1);

// Qo'l (Teri rangi)
const handMat = new THREE.MeshStandardMaterial({color: 0xe0ac69});
const hand = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.15), handMat);
hand.position.set(0, -0.05, -0.15);
const arm = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.4), new THREE.MeshStandardMaterial({color: 0x2d3a22}));
arm.position.set(0.1, -0.2, 0.1);
arm.rotation.x = 0.5;

gunGroup.add(gunBody, gunBarrel, gunHandle, hand, arm);
gunGroup.position.set(0.25, -0.25, -0.5);
camera.add(gunGroup);
scene.add(camera);

// --- DUSHMANLAR ---
let enemies = [];
function spawnEnemy(){
  if(enemies.length >= 12) return;
  const eGroup = new THREE.Group();
  
  // Tana
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 1.2, 0.4),
    new THREE.MeshStandardMaterial({color: 0x8b0000})
  );
  body.position.y = 0.6; body.castShadow = true;
  eGroup.add(body);

  // Bosh
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.25, 8, 8),
    new THREE.MeshStandardMaterial({color: 0x222222})
  );
  head.position.y = 1.45; head.castShadow = true;
  eGroup.add(head);

  // Nishon
  const targetDot = new THREE.Mesh(
    new THREE.SphereGeometry(0.05, 4, 4),
    new THREE.MeshBasicMaterial({color: 0xff0000})
  );
  targetDot.position.set(0, 1.45, 0.25);
  eGroup.add(targetDot);

  const angle = Math.random() * Math.PI * 2;
  const dist = 15 + Math.random() * 20;
  eGroup.position.set(Math.sin(angle)*dist, 0, Math.cos(angle)*dist);
  scene.add(eGroup);
  
  enemies.push({ mesh: eGroup, lastShot: 0 });
}

// --- O'QLAR ---
let bullets = [];
let enemyBullets = [];

function playerShoot() {
  gunGroup.position.z = -0.4; 
  setTimeout(() => gunGroup.position.z = -0.5, 50);

  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const intersects = raycaster.intersectObjects(enemies.map(e => e.mesh), true);

  const bGeo = new THREE.SphereGeometry(0.05);
  const bMat = new THREE.MeshBasicMaterial({color: 0xffff00});
  const bullet = new THREE.Mesh(bGeo, bMat);
  
  const startPos = new THREE.Vector3();
  gunBarrel.getWorldPosition(startPos);
  bullet.position.copy(startPos);
  
  const targetPos = intersects.length > 0 ? intersects[0].point : raycaster.ray.at(50, new THREE.Vector3());
  const dir = targetPos.clone().sub(startPos).normalize();
  
  scene.add(bullet);
  bullets.push({ mesh: bullet, dir: dir, life: 1.0 });

  if (intersects.length > 0) {
    let hitGroup = intersects[0].object.parent;
    scene.remove(hitGroup);
    enemies = enemies.filter(e => e.mesh !== hitGroup);
    score++;
    document.getElementById('score').textContent = score;
  }
}

// --- BOSHQARUV ---
let yaw = 0, pitch = 0;
let joy = {x:0, y:0};
let hp = 100, score = 0, running = false;

// Joystick
const joyEl = document.getElementById('joy');
const stick = document.getElementById('stick');
let joyActive = false;
joyEl.addEventListener('pointerdown', e => { joyActive = true; joyEl.setPointerCapture(e.pointerId); });
joyEl.addEventListener('pointermove', e => {
  if(!joyActive) return;
  const r = joyEl.getBoundingClientRect();
  let x = e.clientX - r.left - r.width/2;
  let y = e.clientY - r.top - r.height/2;
  const max = 30, d = Math.hypot(x,y);
  if(d > max){ x = x/d*max; y = y/d*max; }
  joy.x = x/max; joy.y = y/max;
  stick.style.transform = `translate(${x}px,${y}px)`;
});
joyEl.addEventListener('pointerup', () => { joyActive = false; joy={x:0,y:0}; stick.style.transform='translate(0,0)'; });

// Qarash
const lookEl = document.getElementById('look');
let lookActive = false, lastX = 0, lastY = 0;
lookEl.addEventListener('pointerdown', e => { lookActive = true; lastX = e.clientX; lastY = e.clientY; lookEl.setPointerCapture(e.pointerId); });
lookEl.addEventListener('pointermove', e => {
  if(!lookActive) return;
  yaw -= (e.clientX - lastX) * 0.003;
  pitch = THREE.MathUtils.clamp(pitch - (e.clientY - lastY) * 0.003, -1.2, 1.2);
  lastX = e.clientX; lastY = e.clientY;
});
lookEl.addEventListener('pointerup', () => lookActive = false);

// Otish
let firing = false, lastShotTime = 0;
const fireBtn = document.getElementById('fire');
fireBtn.addEventListener('pointerdown', e => { e.preventDefault(); firing = true; });
fireBtn.addEventListener('pointerup', () => firing = false);
fireBtn.addEventListener('pointerleave', () => firing = false);

// --- O'YIN SIKLI ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  if(running) {
    camera.rotation.order = 'YXZ';
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    // Harakat
    const speed = 8;
    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    forward.y = 0; forward.normalize();
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    right.y = 0; right.normalize();

    const moveDir = new THREE.Vector3();
    moveDir.addScaledVector(forward, -joy.y);
    moveDir.addScaledVector(right, joy.x);
    
    if(moveDir.length() > 0) {
      moveDir.normalize();
      camera.position.addScaledVector(moveDir, speed * dt);
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, -45, 45);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, -45, 45);
    }
    camera.position.y = 1.6;

    // Otish
    if(firing && Date.now() - lastShotTime > 150) {
      playerShoot();
      lastShotTime = Date.now();
    }

    // Dushmanlar AI
    enemies.forEach(e => {
      const dir = new THREE.Vector3().subVectors(camera.position, e.mesh.position);
      dir.y = 0;
      const dist = dir.length();
      
      if(dist > 5) {
        dir.normalize();
        e.mesh.position.addScaledVector(dir, 2 * dt);
      } else {
        if(Date.now() - e.lastShot > 1500) {
          hp -= 5;
          document.getElementById('hp').textContent = Math.max(0, Math.floor(hp));
          e.lastShot = Date.now();
          
          const eb = new THREE.Mesh(new THREE.SphereGeometry(0.08), new THREE.MeshBasicMaterial({color: 0xff0000}));
          eb.position.copy(e.mesh.position);
          scene.add(eb);
          enemyBullets.push({ mesh: eb, dir: dir.clone(), life: 1.0 });
        }
      }
    });

    // O'qlarni yangilash
    for(let i = bullets.length-1; i >= 0; i--) {
      bullets[i].mesh.position.addScaledVector(bullets[i].dir, 50 * dt);
      bullets[i].life -= dt;
      if(bullets[i].life <= 0) { scene.remove(bullets[i].mesh); bullets.splice(i, 1); }
    }
    for(let i = enemyBullets.length-1; i >= 0; i--) {
      enemyBullets[i].mesh.position.addScaledVector(enemyBullets[i].dir, 20 * dt);
      enemyBullets[i].life -= dt;
      if(enemyBullets[i].life <= 0) { scene.remove(enemyBullets[i].mesh); enemyBullets.splice(i, 1); }
    }

    // O'yin tugashi
    if(hp <= 0) {
      running = false;
      document.getElementById('msg').textContent = "HALOK BO'LDINGIZ";
      document.getElementById('overlay').style.display = 'flex';
      document.querySelector('#overlay h1').textContent = "O'YIN TUGADI";
      document.querySelector('#overlay p').innerHTML = `Sizning natijangiz: <b>${score}</b> ta dushman.<br>Qayta jang qilasizmi?`;
      document.getElementById('play').textContent = "QAYTA O'YNASH";
    }
  }

  renderer.render(scene, camera);
}

// O'yinni boshlash
document.getElementById('play').onclick = () => {
  enemies.forEach(e => scene.remove(e.mesh));
  bullets.forEach(b => scene.remove(b.mesh));
  enemyBullets.forEach(b => scene.remove(b.mesh));
  enemies = []; bullets = []; enemyBullets = [];
  
  camera.position.set(0, 1.6, 0);
  hp = 100; score = 0; yaw = 0; pitch = 0;
  document.getElementById('hp').textContent = hp;
  document.getElementById('score').textContent = score;
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('msg').textContent = '';
  
  running = true;
  for(let i=0; i<6; i++) spawnEnemy();
};

setInterval(() => { if(running) spawnEnemy(); }, 2500);

animate();
</script>
</body>
</html>
