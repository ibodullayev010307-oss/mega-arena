<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BATTLE ROYALE - O'rmon</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;overflow:hidden;font-family:Arial,sans-serif;touch-action:none;user-select:none}
#game{display:block;width:100vw;height:100dvh}
#hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none;color:#fff;font-weight:bold;text-shadow:0 2px 4px #000}
.stat{background:rgba(0,0,0,0.5);padding:8px 14px;border-radius:8px;font-size:14px}
#crosshair{position:absolute;top:50%;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;pointer-events:none;z-index:10}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#fff;box-shadow:0 0 5px #fff}
#crosshair::before{width:2px;height:20px;left:9px}
#crosshair::after{width:20px;height:2px;top:9px}
#joy{position:absolute;bottom:40px;left:30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.3)}
#stick{position:absolute;width:45px;height:45px;left:32.5px;top:32.5px;background:rgba(255,255,255,0.7);border-radius:50%}
#fire{position:absolute;bottom:50px;right:30px;width:80px;height:80px;border-radius:50%;background:rgba(255,50,50,0.8);color:#fff;border:2px solid #fff;font-size:15px;font-weight:bold}
#look{position:absolute;top:0;right:0;width:60%;height:85%;touch-action:none}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;z-index:20}
.box{background:#1a1a1a;padding:30px;border-radius:12px;max-width:360px;width:90%;border:1px solid #333}
.box h1{color:#00ffcc;margin-bottom:10px;font-size:24px}
.box p{font-size:14px;color:#aaa;line-height:1.6;margin-bottom:20px}
.box button{width:100%;padding:15px;border:0;border-radius:8px;background:#00ffcc;color:#000;font-size:18px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="stat">🎯 <span id="score">0</span></div>
  <div class="stat">❤️ <span id="hp">100</span></div>
</div>
<div id="crosshair"></div>
<div id="joy"><div id="stick"></div></div>
<div id="look"></div>
<button id="fire">FIRE</button>
<div id="overlay"><div class="box">
  <h1>O'RMON JANGI</h1>
  <p>Chap joystick — yurish.<br>O'ng barmoq — atrofga qarash.<br>FIRE — o'q otish.</p>
  <button id="play">JANGNI BOSHLASH</button>
</div></div>

<script>
const scene = new THREE.Scene();
// Osmon rangi va tuman
scene.background = new THREE.Color(0x87CEEB); 
scene.fog = new THREE.FogExp2(0x87CEEB, 0.015); // Uzoqni xiralashtiradi (realizm uchun)

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('game'), antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// Quyosh nuri
const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
sunLight.position.set(50, 100, 50);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.left = -60;
sunLight.shadow.camera.right = 60;
sunLight.shadow.camera.top = 60;
sunLight.shadow.camera.bottom = -60;
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

// 1. YER (O'tloq)
const groundGeo = new THREE.PlaneGeometry(300, 300);
const groundMat = new THREE.MeshStandardMaterial({color: 0x3b6b3b, roughness: 1});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// 2. DARYO (Suv)
const waterGeo = new THREE.PlaneGeometry(40, 300);
const waterMat = new THREE.MeshStandardMaterial({
  color: 0x1E90FF, 
  transparent: true, 
  opacity: 0.8, 
  roughness: 0.1, 
  metalness: 0.8
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI / 2;
water.position.set(20, 0.1, 0); // Yerdan sal baland
scene.add(water);

// 3. O'RMON (Daraxtlar)
function createTree(x, z) {
  const treeGroup = new THREE.Group();
  
  // Tana (Yog'och)
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.5, 4, 6),
    new THREE.MeshStandardMaterial({color: 0x4a3b2a})
  );
  trunk.position.y = 2;
  trunk.castShadow = true;
  treeGroup.add(trunk);
  
  // Barglar (Yashil)
  const leavesMat = new THREE.MeshStandardMaterial({color: 0x2d5a27});
  const leaves1 = new THREE.Mesh(new THREE.ConeGeometry(2.5, 4, 7), leavesMat);
  leaves1.position.y = 4.5;
  leaves1.castShadow = true;
  treeGroup.add(leaves1);
  
  const leaves2 = new THREE.Mesh(new THREE.ConeGeometry(2, 3, 7), leavesMat);
  leaves2.position.y = 6.5;
  leaves2.castShadow = true;
  treeGroup.add(leaves2);

  treeGroup.position.set(x, 0, z);
  scene.add(treeGroup);
}

// 4. BINOLAR
function createBuilding(x, z) {
  const bGroup = new THREE.Group();
  
  // Devorlar
  const walls = new THREE.Mesh(
    new THREE.BoxGeometry(8, 5, 8),
    new THREE.MeshStandardMaterial({color: 0x9e9e9e}) // Kulrang beton
  );
  walls.position.y = 2.5;
  walls.castShadow = true;
  walls.receiveShadow = true;
  bGroup.add(walls);

  // Tom
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(6.5, 3, 4),
    new THREE.MeshStandardMaterial({color: 0x5c4033}) // Jigarrang tom
  );
  roof.position.y = 6.5;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  bGroup.add(roof);
  
  // Eshik (Qora)
  const door = new THREE.Mesh(
    new THREE.PlaneGeometry(1.5, 2.5),
    new THREE.MeshBasicMaterial({color: 0x111111})
  );
  door.position.set(0, 1.25, 4.01);
  bGroup.add(door);

  bGroup.position.set(x, 0, z);
  scene.add(bGroup);
}

// Daryoning chap tomoniga daraxtlar va binolar ekamiz
for(let i=0; i<80; i++) {
  const x = -10 - Math.random() * 80; // Daryodan chapda
  const z = Math.random() * 150 - 75;
  createTree(x, z);
}
// Bir nechta bino
createBuilding(-20, -20);
createBuilding(-40, 15);
createBuilding(-15, 40);

// --- O'YINCHI QUROLI ---
const gunGroup = new THREE.Group();
const gunMat = new THREE.MeshStandardMaterial({color: 0x222222, metalness: 0.8, roughness: 0.3});
const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.6), gunMat);
gunBody.position.set(0, 0, -0.3);
const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4), gunMat);
gunBarrel.rotation.x = Math.PI/2;
gunBarrel.position.set(0, 0.05, -0.7);
gunGroup.add(gunBody, gunBarrel);
gunGroup.position.set(0.25, -0.25, -0.5);
camera.add(gunGroup);
scene.add(camera);

// --- HAQIQIY ODAM QIYOFASIDAGI DUSHMAN ---
let enemies = [];
function spawnEnemy(){
  if(enemies.length >= 10) return;
  const eGroup = new THREE.Group();
  
  // Oyoqlar
  const legMat = new THREE.MeshStandardMaterial({color: 0x2d3a22}); // Yashil shim
  const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.2), legMat);
  leftLeg.position.set(-0.15, 0.4, 0);
  const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.2), legMat);
  rightLeg.position.set(0.15, 0.4, 0);
  eGroup.add(leftLeg, rightLeg);
  
  // Tana (Kiyim)
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.7, 0.3),
    new THREE.MeshStandardMaterial({color: 0x4a4a4a}) // Kulrang ko'ylak
  );
  body.position.y = 1.15;
  body.castShadow = true;
  eGroup.add(body);

  // Qo'llar
  const armMat = new THREE.MeshStandardMaterial({color: 0x4a4a4a});
  const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.6, 0.15), armMat);
  leftArm.position.set(-0.35, 1.2, 0);
  const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.6, 0.15), armMat);
  rightArm.position.set(0.35, 1.2, 0);
  eGroup.add(leftArm, rightArm);

  // Bosh va Niqob
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.2, 12, 12),
    new THREE.MeshStandardMaterial({color: 0xe0ac69}) // Teri rangi
  );
  head.position.y = 1.65;
  eGroup.add(head);
  
  const mask = new THREE.Mesh(
    new THREE.SphereGeometry(0.21, 12, 12, 0, Math.PI*2, 0, Math.PI/2),
    new THREE.MeshStandardMaterial({color: 0x111111}) // Qora niqob
  );
  mask.position.y = 1.65;
  eGroup.add(mask);

  // Dushman quroli
  const eGun = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.8), gunMat);
  eGun.position.set(0.35, 1.1, 0.2);
  eGroup.add(eGun);

  // Joylashuv (Daryoning narigi tomonida)
  const x = 15 + Math.random() * 40;
  const z = Math.random() * 100 - 50;
  eGroup.position.set(x, 0, z);
  scene.add(eGroup);
  
  enemies.push({ mesh: eGroup, lastShot: 0, hp: 100 });
}

// --- O'QLAR ---
let bullets = [];
let enemyBullets = [];

function playerShoot() {
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const intersects = raycaster.intersectObjects(enemies.map(e => e.mesh), true);

  const bGeo = new THREE.SphereGeometry(0.08);
  const bMat = new THREE.MeshBasicMaterial({color: 0xffff00});
  const bullet = new THREE.Mesh(bGeo, bMat);
  const startPos = new THREE.Vector3();
  gunBarrel.getWorldPosition(startPos);
  bullet.position.copy(startPos);
  
  const targetPos = intersects.length > 0 ? intersects[0].point : raycaster.ray.at(100, new THREE.Vector3());
  const dir = targetPos.clone().sub(startPos).normalize();
  
  scene.add(bullet);
  bullets.push({ mesh: bullet, dir: dir, life: 1.0 });

  if (intersects.length > 0) {
    let hitEnemy = enemies.find(e => e.mesh === intersects[0].object.parent);
    if(hitEnemy) {
      hitEnemy.hp -= 50; // 2 ta o'qda o'ladi
      if(hitEnemy.hp <= 0) {
        scene.remove(hitEnemy.mesh);
        enemies = enemies.filter(e => e !== hitEnemy);
        score++;
        document.getElementById('score').textContent = score;
      }
    }
  }
}

// Boshqaruv
let yaw = 0, pitch = 0, joy = {x:0, y:0};
let hp = 100, score = 0, running = false, firing = false, lastShotTime = 0;

const joyEl = document.getElementById('joy'), stick = document.getElementById('stick');
let joyActive = false;
joyEl.addEventListener('pointerdown', e => { joyActive = true; joyEl.setPointerCapture(e.pointerId); });
joyEl.addEventListener('pointermove', e => {
  if(!joyActive) return;
  const r = joyEl.getBoundingClientRect();
  let x = e.clientX - r.left - r.width/2;
  let y = e.clientY - r.top - r.height/2;
  const max = 30, d = Math.hypot(x,y);
  if(d > max){ x = x/d*max; y = y/d*max; }
  joy.x = x/max; joy.y = y/max;
  stick.style.transform = `translate(${x}px,${y}px)`;
});
joyEl.addEventListener('pointerup', () => { joyActive = false; joy={x:0,y:0}; stick.style.transform='translate(0,0)'; });

const lookEl = document.getElementById('look');
let lookActive = false, lastX = 0, lastY = 0;
lookEl.addEventListener('pointerdown', e => { lookActive = true; lastX = e.clientX; lastY = e.clientY; lookEl.setPointerCapture(e.pointerId); });
lookEl.addEventListener('pointermove', e => {
  if(!lookActive) return;
  yaw -= (e.clientX - lastX) * 0.003;
  pitch = THREE.MathUtils.clamp(pitch - (e.clientY - lastY) * 0.003, -1.0, 1.0);
  lastX = e.clientX; lastY = e.clientY;
});
lookEl.addEventListener('pointerup', () => lookActive = false);

const fireBtn = document.getElementById('fire');
fireBtn.addEventListener('pointerdown', e => { e.preventDefault(); firing = true; });
fireBtn.addEventListener('pointerup', () => firing = false);
fireBtn.addEventListener('pointerleave', () => firing = false);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  if(running) {
    camera.rotation.order = 'YXZ';
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    // Harakat
    const speed = 6;
    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    forward.y = 0; forward.normalize();
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    right.y = 0; right.normalize();

    const moveDir = new THREE.Vector3();
    moveDir.addScaledVector(forward, -joy.y);
    moveDir.addScaledVector(right, joy.x);
    
    if(moveDir.length() > 0) {
      moveDir.normalize();
      camera.position.addScaledVector(moveDir, speed * dt);
    }
    camera.position.y = 1.6;

    // Otish
    if(firing && Date.now() - lastShotTime > 150) {
      playerShoot();
      lastShotTime = Date.now();
    }

    // Dushmanlar AI
    enemies.forEach(e => {
      const dir = new THREE.Vector3().subVectors(camera.position, e.mesh.position);
      dir.y = 0;
      const dist = dir.length();
      
      // Daryodan o'tib hujum qiladi
      if(dist > 8) {
        dir.normalize();
        e.mesh.position.addScaledVector(dir, 2.5 * dt);
        e.mesh.rotation.y = Math.atan2(dir.x, dir.z);
      } else {
        if(Date.now() - e.lastShot > 1200) {
          hp -= 8;
          document.getElementById('hp').textContent = Math.max(0, Math.floor(hp));
          e.lastShot = Date.now();
          
          const eb = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({color: 0xff0000}));
          eb.position.copy(e.mesh.position);
          eb.position.y = 1.2;
          scene.add(eb);
          enemyBullets.push({ mesh: eb, dir: dir.clone().normalize(), life: 1.0 });
        }
      }
    });

    for(let i = bullets.length-1; i >= 0; i--) {
      bullets[i].mesh.position.addScaledVector(bullets[i].dir, 80 * dt);
      bullets[i].life -= dt;
      if(bullets[i].life <= 0) { scene.remove(bullets[i].mesh); bullets.splice(i, 1); }
    }
    for(let i = enemyBullets.length-1; i >= 0; i--) {
      enemyBullets[i].mesh.position.addScaledVector(enemyBullets[i].dir, 30 * dt);
      enemyBullets[i].life -= dt;
      if(enemyBullets[i].life <= 0) { scene.remove(enemyBullets[i].mesh); enemyBullets.splice(i, 1); }
    }

    if(hp <= 0) {
      running = false;
      document.getElementById('overlay').style.display = 'flex';
      document.querySelector('#overlay h1').textContent = "HALOK BO'LDINGIZ";
      document.querySelector('#overlay p').innerHTML = `Siz <b>${score}</b> ta dushmanni yo'q qildingiz.`;
      document.getElementById('play').textContent = "QAYTA O'YNASH";
    }
  }

  renderer.render(scene, camera);
}

document.getElementById('play').onclick = () => {
  enemies.forEach(e => scene.remove(e.mesh));
  bullets.forEach(b => scene.remove(b.mesh));
  enemyBullets.forEach(b => scene.remove(b.mesh));
  enemies = []; bullets = []; enemyBullets = [];
  
  camera.position.set(-5, 1.6, 0); // Daryoning chap tomonida boshlaydi
  hp = 100; score = 0; yaw = Math.PI/2; pitch = 0; // Daryoga qarab
  document.getElementById('hp').textContent = hp;
  document.getElementById('score').textContent = score;
  document.getElementById('overlay').style.display = 'none';
  
  running = true;
  for(let i=0; i<6; i++) spawnEnemy();
};

setInterval(() => { if(running) spawnEnemy(); }, 3000);
animate();
</script>
</body>
</html>
