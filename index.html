<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MORTAL ARENA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;touch-action:none;user-select:none}
#game{display:block;width:100vw;height:100dvh}
#hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none;color:#fff;font-weight:bold;text-shadow:0 2px 4px #000;z-index:10}
.health-bar{width:40%;height:20px;background:#333;border:2px solid #fff;border-radius:4px;overflow:hidden}
.health-fill{height:100%;background:#ff3333;transition:width 0.2s}
.health-fill.p2{background:#33aaff;float:right}
.controls{position:absolute;bottom:20px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 20px;z-index:10}
.btn-group{display:flex;gap:10px}
button.act{width:60px;height:60px;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,0.2);color:#fff;font-weight:bold;font-size:12px;backdrop-filter:blur(4px)}
button.act:active{background:rgba(255,255,255,0.5)}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;z-index:20}
.box{background:#1a1a1a;padding:30px;border-radius:12px;max-width:360px;width:90%;border:2px solid #ff3333}
.box h1{color:#ff3333;margin-bottom:10px;font-size:28px;text-transform:uppercase;letter-spacing:2px}
.box p{font-size:14px;color:#ccc;line-height:1.6;margin-bottom:20px}
.box button{width:100%;padding:15px;border:0;border-radius:8px;background:#ff3333;color:#fff;font-size:18px;font-weight:bold;cursor:pointer;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="health-bar"><div class="health-fill" id="hp1"></div></div>
  <div class="health-bar"><div class="health-fill p2" id="hp2"></div></div>
</div>

<div class="controls">
  <div class="btn-group">
    <button class="act" id="btn-left">◀</button>
    <button class="act" id="btn-right">▶</button>
  </div>
  <div class="btn-group">
    <button class="act" id="btn-jump">SAKRA</button>
    <button class="act" id="btn-block">HIMOYA</button>
    <button class="act" id="btn-punch">MUSHT</button>
    <button class="act" id="btn-kick">TEPKI</button>
  </div>
</div>

<div id="overlay"><div class="box">
  <h1>Mortal Arena</h1>
  <p>Raqibingizni mag'lub eting!<br>◀ ▶ — Harakat<br>MUSHT / TEPKI — Zarba berish<br>HIMOYA — Bloklash<br>SAKRA — Sakrash</p>
  <button id="play">JANGNI BOSHLASH</button>
</div></div>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a0a0a); // To'q qizil
scene.fog = new THREE.Fog(0x1a0a0a, 10, 30);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 3, 8); // Yon tomondan kamera
camera.lookAt(0, 1.5, 0);

const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('game'), antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// Yorug'lik
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const spotLight = new THREE.SpotLight(0xffaa88, 1.5);
spotLight.position.set(0, 10, 5);
spotLight.castShadow = true;
scene.add(spotLight);

// Jang maydoni (Pol)
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 10),
  new THREE.MeshStandardMaterial({color: 0x2c1a1a, roughness: 0.9})
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Orqa fon (Devor)
const backWall = new THREE.Mesh(
  new THREE.BoxGeometry(30, 10, 1),
  new THREE.MeshStandardMaterial({color: 0x0a0a0a})
);
backWall.position.set(0, 5, -4);
scene.add(backWall);

// --- PERSONAJ YARATISH ---
function createFighter(color) {
  const group = new THREE.Group();
  
  // Tana
  const bodyMat = new THREE.MeshStandardMaterial({color: color});
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1, 0.4), bodyMat);
  body.position.y = 1;
  body.castShadow = true;
  group.add(body);

  // Bosh
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), new THREE.MeshStandardMaterial({color: 0xe0ac69}));
  head.position.y = 1.7;
  head.castShadow = true;
  group.add(head);

  // Qo'llar
  const armL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.6, 0.15), bodyMat);
  armL.position.set(-0.4, 1.1, 0);
  armL.castShadow = true;
  group.add(armL);
  
  const armR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.6, 0.15), bodyMat);
  armR.position.set(0.4, 1.1, 0);
  armR.castShadow = true;
  group.add(armR);

  // Oyoqlar
  const legMat = new THREE.MeshStandardMaterial({color: 0x222222});
  const legL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.2), legMat);
  legL.position.set(-0.15, 0.4, 0);
  legL.castShadow = true;
  group.add(legL);

  const legR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.2), legMat);
  legR.position.set(0.15, 0.4, 0);
  legR.castShadow = true;
  group.add(legR);

  return group;
}

const p1 = createFighter(0x1e5aaa); // Ko'k (O'yinchi)
p1.position.set(-2, 0, 0);
scene.add(p1);

const p2 = createFighter(0xaa1e1e); // Qizil (Raqib)
p2.position.set(2, 0, 0);
p2.rotation.y = Math.PI; // O'yinga qarab turishi uchun
scene.add(p2);

// O'yin holati
let p1_hp = 100, p2_hp = 100;
let running = false;
let p1_action = "idle"; // idle, punch, kick, block, jump
let p1_timer = 0;
let p1_vel_y = 0;
let p1_ground = true;

let p2_action = "idle";
let p2_timer = 0;
let p2_vel_y = 0;
let p2_ground = true;

const keys = { left: false, right: false };

// Boshqaruv tugmalari
const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
const btnJump = document.getElementById('btn-jump');
const btnBlock = document.getElementById('btn-block');
const btnPunch = document.getElementById('btn-punch');
const btnKick = document.getElementById('btn-kick');

btnLeft.addEventListener('pointerdown', () => keys.left = true);
btnLeft.addEventListener('pointerup', () => keys.left = false);
btnLeft.addEventListener('pointerleave', () => keys.left = false);

btnRight.addEventListener('pointerdown', () => keys.right = true);
btnRight.addEventListener('pointerup', () => keys.right = false);
btnRight.addEventListener('pointerleave', () => keys.right = false);

btnJump.addEventListener('pointerdown', () => {
  if(p1_ground && p1_action === "idle") { p1_vel_y = 8; p1_ground = false; p1_action = "jump"; }
});
btnBlock.addEventListener('pointerdown', () => { if(p1_action === "idle") p1_action = "block"; });
btnBlock.addEventListener('pointerup', () => { if(p1_action === "block") p1_action = "idle"; });
btnPunch.addEventListener('pointerdown', () => attack("punch"));
btnKick.addEventListener('pointerdown', () => attack("kick"));

function attack(type) {
  if(p1_action !== "idle" || !p1_ground) return;
  p1_action = type;
  p1_timer = 0.3; // Zarba davomiyligi
  
  // Zarba tekshiruvi
  const dist = Math.abs(p1.position.x - p2.position.x);
  if(dist < 2.0) {
    if(p2_action !== "block") {
      p2_hp -= (type === "punch" ? 8 : 12);
      if(p2_hp < 0) p2_hp = 0;
      document.getElementById('hp2').style.width = p2_hp + "%";
      // Orqaga tisarilish
      p2.position.x += (p1.position.x < p2.position.x ? 0.5 : -0.5);
    }
  }
}

// Raqib AI
function aiUpdate(dt) {
  if(p2_action !== "idle") {
    p2_timer -= dt;
    if(p2_timer <= 0) p2_action = "idle";
    return;
  }

  const dist = Math.abs(p1.position.x - p2.position.x);
  
  // Agar o'yinchi yaqin bo'lsa hujum qilish
  if(dist < 2.0) {
    if(Math.random() < 0.05) { // Har doim emas
      p2_action = Math.random() < 0.6 ? "punch" : "kick";
      p2_timer = 0.3;
      
      if(p1_action !== "block") {
        p1_hp -= (p2_action === "punch" ? 8 : 12);
        if(p1_hp < 0) p1_hp = 0;
        document.getElementById('hp1').style.width = p1_hp + "%";
      }
    } else if (Math.random() < 0.02) {
      p2_action = "block";
      p2_timer = 0.5;
    }
  } else {
    // Yaqinlashish
    if(p2.position.x > p1.position.x) p2.position.x -= 1.5 * dt;
    else p2.position.x += 1.5 * dt;
  }
}

// Animatsiya yangilash
function animateFighter(fighter, action) {
  if(action === "idle") {
    fighter.rotation.x = 0;
    fighter.position.y = 0;
  } else if(action === "punch") {
    fighter.rotation.x = 0.2;
  } else if(action === "kick") {
    fighter.rotation.x = -0.2;
  } else if(action === "block") {
    fighter.rotation.x = 0.3; // Orqaga egilish
  }
}

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  if(running) {
    // P1 Harakati
    if(p1_action === "idle" || p1_action === "block") {
      if(keys.left && p1.position.x > -4) p1.position.x -= 3 * dt;
      if(keys.right && p1.position.x < 4) p1.position.x += 3 * dt;
    }

    // P1 Sakrash fizikasi
    if(!p1_ground) {
      p1_vel_y -= 20 * dt;
      p1.position.y += p1_vel_y * dt;
      if(p1.position.y <= 0) {
        p1.position.y = 0;
        p1_ground = true;
        p1_action = "idle";
      }
    }

    // P1 zarba taymeri
    if(p1_action !== "idle" && p1_action !== "block" && p1_action !== "jump") {
      p1_timer -= dt;
      if(p1_timer <= 0) p1_action = "idle";
    }

    // AI
    aiUpdate(dt);

    // Animatsiyalar
    animateFighter(p1, p1_action);
    animateFighter(p2, p2_action);

    // Kamera kuzatishi (o'rtaga qaratish)
    const midX = (p1.position.x + p2.position.x) / 2;
    camera.position.x += (midX - camera.position.x) * 5 * dt;
    camera.lookAt(midX, 1.5, 0);

    // O'yin tugashi
    if(p1_hp <= 0 || p2_hp <= 0) {
      running = false;
      document.getElementById('overlay').style.display = 'flex';
      document.querySelector('#overlay h1').textContent = p1_hp <= 0 ? "MAG'LUBIYAT" : "G'ALABA!";
      document.querySelector('#overlay p').innerHTML = p1_hp <= 0 ? "Siz yutqazdingiz..." : "Siz raqibni yutdingiz!";
      document.getElementById('play').textContent = "QAYTA O'YNASH";
    }
  }

  renderer.render(scene, camera);
}

document.getElementById('play').onclick = () => {
  p1_hp = 100; p2_hp = 100;
  document.getElementById('hp1').style.width = '100%';
  document.getElementById('hp2').style.width = '100%';
  
  p1.position.set(-2, 0, 0); p2.position.set(2, 0, 0);
  p1_action = "idle"; p2_action = "idle";
  p1_ground = true; p2_ground = true;
  
  document.getElementById('overlay').style.display = 'none';
  running = true;
};

animate();
</script>
</body>
</html>
